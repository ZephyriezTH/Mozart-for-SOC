<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MOZART for SOC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f4f5f8; --panel: #ffffff; --ink: #1d2433; --muted: #5d6677; --line: #e1e4ea;
  --brand: #d71920; --navy: #1f3a6e; --hover: #f0f2f6; --active: #fdecec;
  --v: #1f7a4d; --v-bg: #e3f4ea; --f: #1f4fa8; --f-bg: #e5edfb; --o: #7a5a12; --o-bg: #f7efd9;
  --shadow: 0 1px 3px rgba(20,30,50,.08), 0 6px 24px rgba(20,30,50,.06);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12151c; --panel: #1a1f29; --ink: #e7eaf0; --muted: #9aa3b4; --line: #2b3240;
    --brand: #ff5a5f; --navy: #8fb0ee; --hover: #222937; --active: #3a2024;
    --v: #6fd3a0; --v-bg: #183427; --f: #8fb0ee; --f-bg: #1c2a45; --o: #e6c46b; --o-bg: #3a3018;
    --shadow: 0 1px 3px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"] {
  --bg: #12151c; --panel: #1a1f29; --ink: #e7eaf0; --muted: #9aa3b4; --line: #2b3240;
  --brand: #ff5a5f; --navy: #8fb0ee; --hover: #222937; --active: #3a2024;
  --v: #6fd3a0; --v-bg: #183427; --f: #8fb0ee; --f-bg: #1c2a45; --o: #e6c46b; --o-bg: #3a3018;
  --shadow: 0 1px 3px rgba(0,0,0,.4);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: "Sarabun", "Leelawadee UI", system-ui, sans-serif; font-size: 15px; line-height: 1.5; }
button { font: inherit; color: inherit; }

.top { position: sticky; top: 0; z-index: 30; height: 56px; display: flex; align-items: center; gap: 12px; padding: 0 16px; background: var(--panel); border-bottom: 3px solid var(--brand); }
.top h1 { margin: 0; font-size: 18px; font-weight: 700; color: var(--navy); white-space: nowrap; }
.top h1 span { color: var(--brand); }
.top .sub { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top .grow { flex: 1; }
.iconbtn { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; height: 36px; min-width: 36px; padding: 0 10px; cursor: pointer; }
.iconbtn:hover { background: var(--hover); }
#menuBtn { display: none; }

.wrap { display: grid; grid-template-columns: 340px minmax(0, 1fr); height: calc(100% - 56px); }
nav { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.navhead { padding: 14px 14px 10px; border-bottom: 1px solid var(--line); }
.seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--hover); border-radius: 10px; padding: 3px; }
.seg button { border: 0; background: transparent; padding: 7px 6px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 14px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--panel); color: var(--ink); box-shadow: var(--shadow); }
.search { margin-top: 10px; width: 100%; height: 36px; border: 1px solid var(--line); border-radius: 8px; padding: 0 10px; background: var(--panel); color: var(--ink); font: inherit; }
.toc { overflow-y: auto; padding: 6px 0 24px; flex: 1; }
.ch { margin: 8px 0 0; }
.ch > summary { list-style: none; cursor: pointer; padding: 8px 14px; font-weight: 700; color: var(--navy); display: flex; align-items: center; gap: 8px; }
.ch > summary::-webkit-details-marker { display: none; }
.ch > summary::before { content: "▸"; font-size: 12px; color: var(--muted); transition: transform .15s; }
.ch[open] > summary::before { transform: rotate(90deg); }
.ch > summary .count { margin-left: auto; font-weight: 500; font-size: 12px; color: var(--muted); }
.chnote { padding: 0 14px 4px 34px; font-size: 12.5px; color: var(--muted); }
.subhd { padding: 6px 14px 2px 34px; font-size: 13px; font-weight: 600; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.item { display: flex; gap: 8px; align-items: baseline; width: 100%; text-align: left; border: 0; background: transparent; padding: 5px 14px 5px 34px; cursor: pointer; font-size: 14px; }
.item:hover { background: var(--hover); }
.item[aria-current="true"] { background: var(--active); box-shadow: inset 3px 0 0 var(--brand); font-weight: 600; }
.item .pg { flex: 0 0 26px; color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12.5px; text-align: right; }
.empty { padding: 16px; color: var(--muted); }

.badge { display: inline-block; font-size: 11.5px; font-weight: 700; padding: 1px 8px; border-radius: 999px; line-height: 1.6; white-space: nowrap; }
.b-V { color: var(--v); background: var(--v-bg); }
.b-F { color: var(--f); background: var(--f-bg); }
.b-O { color: var(--o); background: var(--o-bg); }

main { overflow-y: auto; min-height: 0; min-width: 0; }
.stage { max-width: 920px; margin: 0 auto; padding: 18px 16px 40px; }
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; margin-bottom: 10px; }
.meta h2 { margin: 0; font-size: 20px; font-weight: 700; flex: 1 1 0; min-width: 0; overflow-wrap: anywhere; }
.meta .where { width: 100%; color: var(--muted); font-size: 13px; }
.desc { margin: 0 0 12px; color: var(--muted); font-size: 14px; }
.slide { background: #fff; border-radius: 6px; box-shadow: var(--shadow); overflow: hidden; aspect-ratio: 1240 / 1791; }
.slide img { display: block; width: 100%; height: 100%; object-fit: contain; }
.pager { position: sticky; bottom: 0; display: flex; align-items: center; gap: 10px; justify-content: center; padding: 12px 0; margin-top: 12px; background: linear-gradient(transparent, var(--bg) 30%); }
.pager button { border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 8px 18px; cursor: pointer; font-weight: 600; box-shadow: var(--shadow); }
.pager button:disabled { opacity: .4; cursor: default; }
.pager .pos { color: var(--muted); font-size: 13px; min-width: 92px; text-align: center; font-variant-numeric: tabular-nums; }
.scrim { display: none; }

@media (max-width: 900px) {
  #menuBtn { display: inline-block; }
  .top .sub { display: none; }
  .wrap { grid-template-columns: minmax(0, 1fr); }
  nav { position: fixed; z-index: 40; top: 56px; bottom: 0; left: 0; width: min(88vw, 360px); transform: translateX(-102%); transition: transform .2s; box-shadow: var(--shadow); }
  body.menu-open nav { transform: none; }
  body.menu-open .scrim { display: block; position: fixed; inset: 56px 0 0 0; background: rgba(0,0,0,.35); z-index: 35; }
  .meta h2 { font-size: 17px; }
}
</style>
</head>
<body>
<header class="top">
  <button class="iconbtn" id="menuBtn" aria-label="เปิดเมนู">☰</button>
  <h1><span>MOZART</span> for SOC</h1>
  <div class="sub">MOZART for SOC Operator and Security Officer</div>
  <div class="grow"></div>
  <button class="iconbtn" id="themeBtn" aria-label="สลับธีม" title="สลับธีม">◐</button>
</header>
<div class="wrap">
  <nav aria-label="สารบัญ">
    <div class="navhead">
      <div class="seg" role="group" aria-label="รูปแบบเมนู">
        <button id="modeDoc" aria-pressed="true">เรียงตามเอกสาร</button>
        <button id="modeTrack" aria-pressed="false">แยก Vital / Functional</button>
      </div>
      <input class="search" id="q" type="search" placeholder="ค้นหาหัวข้อ…" autocomplete="off">
    </div>
    <div class="toc" id="toc"></div>
  </nav>
  <main id="main">
    <div class="stage">
      <div class="meta">
        <h2 id="title"></h2>
        <span id="badge"></span>
        <div class="where" id="where"></div>
      </div>
      <p class="desc" id="desc"></p>
      <div class="slide"><img id="img" alt=""></div>
      <div class="pager">
        <button id="prev">‹ ก่อนหน้า</button>
        <span class="pos" id="pos"></span>
        <button id="next">ถัดไป ›</button>
      </div>
    </div>
  </main>
</div>
<div class="scrim" id="scrim"></div>

  for (const c of tree()) {
    let body = '', n = 0;
    for (const [sub, lv, pages] of c.subs) {
      let items = '';
      for (const p of pages) {
        const t = DATA.titles[p];
        const hit = !q || (t.t + ' ' + t.d + ' ' + p).toLowerCase().includes(q);
        if (hit) { items += `<button class="item" data-i="${i}" data-p="${p}"><span class="pg">${p}</span><span>${t.t}</span></button>`; n++; }
        i++;
      }
      if (items) body += `<div class="subhd">${sub} ${mode === 'doc' && lv !== 'O' ? badge(lv) : ''}</div>` + items;
    }
    if (!n) continue;
    any = true;
    const tag = mode === 'track' && c.lv ? badge(c.lv) : '';
    html += `<details class="ch" ${q || containsCurrent(c) ? 'open' : ''}><summary>${c.ch} ${tag}<span class="count">${n}</span></summary>${c.note ? `<div class="chnote">${c.note}</div>` : ''}${body}</details>`;
  }
  toc.innerHTML = any ? html : '<div class="empty">ไม่พบหัวข้อที่ค้นหา</div>';
  markCurrent();
}

function containsCurrent(c) {
  return seq[idx] && seq[idx].ch === c.ch;
}

function markCurrent() {
  for (const el of document.querySelectorAll('.item')) {
    const on = +el.dataset.i === idx;
    el.setAttribute('aria-current', on);
    if (on) el.scrollIntoView({ block: 'nearest' });
  }
}

function show(i, push = true) {
  idx = Math.max(0, Math.min(seq.length - 1, i));
  const s = seq[idx];
  page = s.p;
  const t = DATA.titles[page];
  const pad = String(page).padStart(3, '0');
  $('img').src = `slides/${pad}.webp`;
  $('img').alt = `หน้า ${page}: ${t.t}`;
  $('title').textContent = t.t;
  $('badge').innerHTML = badge(s.lv);
  $('where').textContent = `${s.ch} › ${s.sub} · หน้า ${page} จาก 102`;
  $('desc').textContent = t.d;
  $('pos').textContent = `${idx + 1} / ${seq.length}`;
  $('prev').disabled = idx === 0;
  $('next').disabled = idx === seq.length - 1;
  document.title = `${t.t} · MOZART for SOC`;
  if (push) history.replaceState(null, '', `#${mode === 'track' ? 't' : 'p'}${page}`);
  $('main').scrollTop = 0;
  for (const n of [seq[idx + 1], seq[idx - 1]]) if (n) new Image().src = `slides/${String(n.p).padStart(3, '0')}.webp`;
  markCurrent();
}

function setMode(m, keepPage = true) {
  mode = m;
  store.set('mozart-mode', m);
  $('modeDoc').setAttribute('aria-pressed', m === 'doc');
  $('modeTrack').setAttribute('aria-pressed', m === 'track');
  buildSeq();
  // Slides shared by both tracks (chapter overviews) land on their first occurrence
  const i = keepPage ? seq.findIndex(s => s.p === page) : 0;
  idx = i < 0 ? 0 : i;
  renderToc();
  show(idx);
}

$('modeDoc').onclick = () => setMode('doc');
$('modeTrack').onclick = () => setMode('track');
$('q').oninput = renderToc;
$('toc').onclick = e => {
  const b = e.target.closest('.item');
  if (!b) return;
  show(+b.dataset.i);
  document.body.classList.remove('menu-open');
};
$('prev').onclick = () => show(idx - 1);
$('next').onclick = () => show(idx + 1);
$('menuBtn').onclick = () => document.body.classList.toggle('menu-open');
$('scrim').onclick = () => document.body.classList.remove('menu-open');
$('themeBtn').onclick = () => {
  const dark = matchMedia('(prefers-color-scheme: dark)').matches;
  const cur = document.documentElement.dataset.theme || (dark ? 'dark' : 'light');
  const nxt = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = nxt;
  store.set('mozart-theme', nxt);
};
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === 'ArrowRight' || e.key === 'PageDown') show(idx + 1);
  if (e.key === 'ArrowLeft' || e.key === 'PageUp') show(idx - 1);
});
let tx = null;
$('img').addEventListener('touchstart', e => { tx = e.touches[0].clientX; }, { passive: true });
$('img').addEventListener('touchend', e => {
  if (tx === null) return;
  const dx = e.changedTouches[0].clientX - tx; tx = null;
  if (Math.abs(dx) > 60) show(idx + (dx < 0 ? 1 : -1));
});

const savedTheme = store.get('mozart-theme');
if (savedTheme) document.documentElement.dataset.theme = savedTheme;
const m = location.hash.match(/^#([pt])(\d+)$/);
if (m) { mode = m[1] === 't' ? 'track' : 'doc'; page = Math.min(102, Math.max(1, +m[2])); }
setMode(mode, true);
</script>
</body>
</html>
